nexus-file-converter:
  debug:
    enabled: true
    suspend: false
  beamline: p48
  template:
    entry/:
      NX_class@: NXentry
      instrument/:
        NX_class@: NXinstrument
        name: p48
  containerEnvVars:
    - name: OTEL_EXPORTER_OTLP_PROTOCOL
      value: "http/protobuf"
    - name: OTEL_EXPORTER_OTLP_ENDPOINT
      value: "http://opentelemetry-collector.tracing:4318/v1/traces"
    - name: OTEL_LOG_LEVEL
      value: trace  

  nodeSelector:
    beamline: p48

  tolerations:
    - key: beamline
      operator: Equal
      value: p48
      effect: NoSchedule
    - key: nodetype
      operator: Equal
      value: training-rig
      effect: NoSchedule

  image:
    tags: "4.1.7-a3"
  volumes:
  - name: nexus-data
    hostPath:
      path: /exports/mybeamline/data/
      type: DirectoryOrCreate

  volumeMounts:
  - name: nexus-data
    mountPath: /exports/mybeamline/data/
    mountPropagation: HostToContainer

  application:
    server:
      port: 8084

    otel:
      service:
        name: nexus-file-writing
      exporter:
        otlp:
          endpoint: http://opentelemetry-collector.tracing:4318
    spring:
      profiles:
        active: rabbitmq
      rabbitmq:
        host: p48-rabbitmq
        username: guest
        password: guest
    files:
      output:
        directory:
          staticDirectory: ""  # explicitly empty, get from StartDocument metadata
        
        devices:
          types:
            det: NX_DETECTOR
            sample_stage: NX_COLLECTION
            sample_stage.x: NX_POSITIONER
            sample_stage.theta: NX_POSITIONER
  securityContext:
    runAsUser: 37888 # p48-detector
    runAsGroup: 37888
