# yaml-language-server: $schema=../.helm-shared/values.schema.json

# shared values for all services

global:
  domain: p48
  location: bl48p
  enabled: true

# shared settings for all IOC types
shared: &shared
  # hostNetwork
  # set to true for Channel Access to work outside of the cluster (or use a gateway)
  hostNetwork: true

  # running as ixxdetector account uid,gid gives access to /dls/ixx/data
  securityContext:
    runAsUser: 37888
    runAsGroup: 37888

  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: beamline
                operator: In
                values:
                  - bl48p

  tolerations:
    - key: beamline
      operator: Equal
      value: bl48p
      effect: NoSchedule
    - key: location
      operator: Equal
      value: bl48p
      effect: NoSchedule
    - key: nodetype
      operator: Equal
      value: training-rig
      effect: NoSchedule

# shared settings for all ibek IOCs using the ioc-instance helm chart
ioc-instance:
  <<: *shared

# shared setting for all legacy IOCs using the dev-c7 helm chart
dev-c7:
  <<: *shared
