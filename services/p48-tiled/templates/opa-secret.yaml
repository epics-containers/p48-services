# Bearer token OPA uses to pull the diamond-permissionables bundle from authz.diamond.ac.uk.
# Generate the encrypted value with:
#   echo -n '<token>' | kubeseal --raw --namespace p48-beamline --name opa-secret
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: opa-secret
  namespace: p48-beamline
spec:
  encryptedData:
    authz-bearer-token: 
